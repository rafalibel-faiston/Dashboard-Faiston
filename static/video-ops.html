<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/faiston-ops-mark.svg">
<title>Vídeo · Faiston OPS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<!--
  Vídeo institucional do Faiston OPS (apresentação pra diretoria) — tema claro.

  Tudo é desenhado num <canvas> 1920x1080 por uma função render(t)
  determinística: o mesmo quadro sai igual no navegador e na exportação.

  Atalhos: Espaço = play/pause · R = recomeçar · F = tela cheia · ←/→ = 5s
           C = legendas · S = efeitos sonoros
  Parâmetros: ?loop=1 repete no fim · ?t=20 começa no segundo 20 ·
  ?legendas=0 sem legendas ·
  ?export=1 esconde a interface e expõe window.renderAt(t) /
  window.VIDEO_DURATION (usado pra gerar o MP4 quadro a quadro).
-->
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #F4F5FA; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: Inter, system-ui, sans-serif; color: #0B0D1F; }
    canvas { display: block; width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; }
    .ui {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 12px;
        width: min(760px, calc(100vw - 32px)); padding: 10px 14px;
        background: rgba(255,255,255,0.88); backdrop-filter: blur(10px);
        border: 1px solid #E5E8F0; border-radius: 14px;
        box-shadow: 0 12px 32px -12px rgba(13,15,35,0.18);
        transition: opacity .3s ease; opacity: 1;
    }
    .ui.hide { opacity: 0; pointer-events: none; }
    .ui button {
        border: 1px solid #E5E8F0; background: #fff; color: #0B0D1F;
        height: 34px; min-width: 34px; padding: 0 10px; border-radius: 9px;
        font: 600 13px Inter, sans-serif; cursor: pointer; white-space: nowrap;
    }
    .ui button:hover { background: #ECEEF4; }
    .ui button.primary { background: linear-gradient(135deg, #5B2EE0, #B826C9); color: #fff; border: 0; }
    .ui input[type=range] { flex: 1; min-width: 60px; accent-color: #B826C9; }
    .ui .time { font: 600 12px "JetBrains Mono", monospace; color: #5E647A; min-width: 92px; text-align: center; }
    .ui .rec.on { background: #EC4899; color: #fff; border: 0; }
    .ui button[aria-pressed="true"] { background: #5B2EE0; color: #fff; border-color: #5B2EE0; }
    .ui button:focus-visible { outline: 2px solid #B826C9; outline-offset: 2px; }
    .start {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: transparent; border: 0; cursor: pointer;
    }
    .start span {
        width: 96px; height: 96px; border-radius: 28px;
        background: linear-gradient(135deg, #5B2EE0 0%, #B826C9 55%, #EC4899 100%);
        box-shadow: 0 20px 60px -10px rgba(184,38,201,0.55);
        display: flex; align-items: center; justify-content: center;
    }
    .start.hide { display: none; }
    body.export .ui, body.export .start { display: none; }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>

<button class="start" id="start" aria-label="Reproduzir vídeo">
    <span><svg width="34" height="34" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="#fff"/></svg></span>
</button>

<div class="ui" id="ui">
    <button id="btn-play" class="primary" aria-label="Play/Pause">▶</button>
    <button id="btn-restart" aria-label="Recomeçar">↺</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Linha do tempo">
    <span class="time" id="time">0:00 / 0:00</span>
    <button id="btn-cc" class="on" aria-pressed="true" title="Legendas (C)">CC</button>
    <button id="btn-som" aria-pressed="true" title="Efeitos sonoros (S)">🔊 Sons</button>
    <button id="btn-full" aria-label="Tela cheia">⛶</button>
    <button id="btn-rec" class="rec" title="Grava o vídeo inteiro em tempo real e baixa um .webm">● Gravar .webm</button>
</div>

<script>
(function () {
'use strict';

const W = 1920, H = 1080;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

/* ---------------- Identidade (mesmos tokens do style.css, tema claro) ---------------- */
const C = {
    purple: '#5B2EE0', magenta: '#B826C9', pink: '#EC4899', cyan: '#06D7E6',
    cyanText: '#0891A0',              // ciano legível em fundo branco (mesmo da página de novidades)
    amber: '#F59E0B', green: '#0E9F6E', red: '#EF4444',
    bg: '#F4F5FA', surface: '#FFFFFF', soft: '#F8F9FC',
    text: '#0B0D1F', muted: '#5E647A', faint: '#9097AC',
    border: '#E5E8F0', borderStrong: '#D6DAE6',
};
const GRAD = [C.purple, C.magenta, C.pink];
const GRAD_COOL = [C.cyan, C.purple];
const F = {
    display: '"Space Grotesk", Inter, sans-serif',
    body: 'Inter, system-ui, sans-serif',
    mono: '"JetBrains Mono", ui-monospace, monospace',
};

/* ---------------- Utilidades de animação ---------------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
    out: t => 1 - Math.pow(1 - t, 3),
    inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    expo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
    back: t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
const prog = (t, start, dur) => clamp((t - start) / dur);
const fmtBR = (v, d = 1) => v.toFixed(d).replace('.', ',');
const fmtClock = s => {
    s = Math.max(0, Math.floor(s));
    return `${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
};
const fmtHM = s => `${Math.floor(s / 3600)}h ${String(Math.floor(s / 60) % 60).padStart(2, '0')}m`;

/* ---------------- Primitivas de desenho ---------------- */
function linGrad(x0, y0, x1, y1, stops) {
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
    return g;
}

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}

function panel(x, y, w, h, o = {}) {
    ctx.save();
    if (o.shadow !== false) {
        ctx.shadowColor = o.shadowColor ?? 'rgba(13,15,35,0.10)';
        ctx.shadowBlur = o.blur ?? 48; ctx.shadowOffsetY = o.dy ?? 18;
    }
    rr(x, y, w, h, o.r ?? 24);
    ctx.fillStyle = o.fill ?? C.surface;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.lineWidth = o.lw ?? 1.5;
    ctx.strokeStyle = o.stroke ?? C.border;
    ctx.stroke();
    ctx.restore();
}

function setFont(size, weight, family) { ctx.font = `${weight} ${size}px ${family}`; }

function measure(str, size, weight = 600, family = F.body, ls = 0) {
    ctx.save(); setFont(size, weight, family); ctx.letterSpacing = ls + 'px';
    const w = ctx.measureText(str).width; ctx.restore(); return w;
}

function text(str, x, y, o = {}) {
    const size = o.size ?? 28, weight = o.weight ?? 500, family = o.font ?? F.body;
    ctx.save();
    ctx.globalAlpha *= o.alpha ?? 1;
    setFont(size, weight, family);
    ctx.letterSpacing = (o.ls ?? 0) + 'px';
    ctx.textAlign = o.align ?? 'left';
    ctx.textBaseline = o.base ?? 'alphabetic';
    const w = ctx.measureText(str).width;
    const x0 = ctx.textAlign === 'center' ? x - w / 2 : ctx.textAlign === 'right' ? x - w : x;
    if (o.grad) ctx.fillStyle = linGrad(x0, 0, x0 + w, 0, o.grad);
    else ctx.fillStyle = o.color ?? C.text;
    ctx.fillText(str, x, y);
    if (o.strike) { ctx.fillRect(x0, y - size * 0.32, w, Math.max(1.2, size * 0.07)); }
    ctx.restore();
    return w;
}

/* Texto que sobe de dentro de uma máscara — o "reveal" padrão do vídeo. */
function reveal(str, x, y, p, o = {}) {
    if (p <= 0) return;
    const size = o.size ?? 28;
    const e = E.expo(p);
    ctx.save();
    const w = measure(str, size, o.weight ?? 500, o.font ?? F.body, o.ls ?? 0);
    const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
    ctx.beginPath();
    ctx.rect(x0 - 20, y - size * 1.15, w + 40, size * 1.5);
    ctx.clip();
    text(str, x, y + (1 - e) * size * 1.25, { ...o, alpha: (o.alpha ?? 1) * clamp(p * 3) });
    ctx.restore();
}

function pill(x, y, label, o = {}) {
    const size = o.size ?? 15, padX = o.padX ?? 14, h = o.h ?? size + 16;
    const w = measure(label, size, o.weight ?? 700, F.body, o.ls ?? 0.6) + padX * 2;
    const color = o.color ?? C.purple;
    ctx.save();
    ctx.globalAlpha *= o.alpha ?? 1;
    rr(x, y, w, h, o.r ?? h / 2);
    ctx.fillStyle = o.fill ?? hexA(color, 0.10); ctx.fill();
    if (o.stroke !== false) { ctx.lineWidth = 1.2; ctx.strokeStyle = hexA(color, 0.28); ctx.stroke(); }
    text(label, x + padX, y + h / 2 + 1, { size, weight: o.weight ?? 700, color: o.textColor ?? color, base: 'middle', ls: o.ls ?? 0.6 });
    ctx.restore();
    return w;
}

function avatar(cx, cy, r, letter, grad, ring) {
    ctx.save();
    if (ring) { ctx.beginPath(); ctx.arc(cx, cy, r + 2.5, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); }
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = linGrad(cx - r, cy - r, cx + r, cy + r, grad); ctx.fill();
    text(letter, cx, cy + 1, { size: r * 0.95, weight: 700, align: 'center', base: 'middle', color: '#fff' });
    ctx.restore();
}

/* Marca do Faiston OPS (mesma geometria do faiston-ops-mark.svg). */
function mark(cx, cy, s, o = {}) {
    const k = s / 60;
    ctx.save();
    ctx.globalAlpha *= o.alpha ?? 1;
    ctx.translate(cx, cy);
    if (o.rot) ctx.rotate(o.rot);
    if (o.glow) { ctx.shadowColor = 'rgba(184,38,201,0.40)'; ctx.shadowBlur = 60 * k * o.glow; ctx.shadowOffsetY = 16 * k; }
    rr(-s / 2, -s / 2, s, s, 16 * k);
    ctx.fillStyle = linGrad(-s / 2, -s / 2, s / 2, s / 2, GRAD);
    ctx.fill();
    ctx.shadowColor = 'transparent';
    const tri = o.tri ?? 1;
    if (tri > 0) {
        ctx.save();
        ctx.translate(3 * k, 0);
        ctx.scale(tri, tri);
        ctx.beginPath();
        ctx.moveTo(-9 * k, -10.5 * k); ctx.lineTo(9 * k, 0); ctx.lineTo(-9 * k, 10.5 * k); ctx.closePath();
        ctx.fillStyle = '#fff'; ctx.fill();
        ctx.restore();
    }
    ctx.restore();
}

function wordmark(x, y, size, o = {}) {
    const w1 = text('FAISTON ', x, y, { size, weight: 700, font: F.display, ls: o.ls ?? 0, alpha: o.alpha, base: o.base, color: C.text });
    const w2 = text('OPS', x + w1, y, { size, weight: 700, font: F.display, ls: o.ls ?? 0, grad: GRAD, alpha: o.alpha, base: o.base });
    return w1 + w2;
}

function sparkle(cx, cy, r, color = '#fff') {
    ctx.save(); ctx.beginPath();
    ctx.moveTo(cx, cy - r);
    ctx.quadraticCurveTo(cx, cy, cx + r, cy);
    ctx.quadraticCurveTo(cx, cy, cx, cy + r);
    ctx.quadraticCurveTo(cx, cy, cx - r, cy);
    ctx.quadraticCurveTo(cx, cy, cx, cy - r);
    ctx.fillStyle = color; ctx.fill(); ctx.restore();
}

function check(cx, cy, s, color, p = 1, lw) {
    if (p <= 0) return;
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = lw ?? s * 0.22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const pts = [[-0.45, 0.02], [-0.12, 0.34], [0.48, -0.32]];
    const len1 = Math.hypot(0.33, 0.32), len2 = Math.hypot(0.6, 0.66), total = len1 + len2;
    const d = p * total;
    ctx.beginPath(); ctx.moveTo(cx + pts[0][0] * s, cy + pts[0][1] * s);
    const a = clamp(d / len1);
    ctx.lineTo(cx + lerp(pts[0][0], pts[1][0], a) * s, cy + lerp(pts[0][1], pts[1][1], a) * s);
    if (d > len1) {
        const b = clamp((d - len1) / len2);
        ctx.lineTo(cx + lerp(pts[1][0], pts[2][0], b) * s, cy + lerp(pts[1][1], pts[2][1], b) * s);
    }
    ctx.stroke(); ctx.restore();
}

function playIcon(cx, cy, s, color) {
    ctx.beginPath(); ctx.moveTo(cx - s * 0.4, cy - s * 0.5); ctx.lineTo(cx + s * 0.5, cy); ctx.lineTo(cx - s * 0.4, cy + s * 0.5); ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
}
function pauseIcon(cx, cy, s, color) {
    ctx.fillStyle = color;
    rr(cx - s * 0.45, cy - s * 0.5, s * 0.3, s, 1.5); ctx.fill();
    rr(cx + s * 0.15, cy - s * 0.5, s * 0.3, s, 1.5); ctx.fill();
}

/* Ponteiro do mouse + "clique" (anel que expande). */
function cursor(x, y, press = 0) {
    ctx.save();
    ctx.translate(x, y);
    const s = 1 - press * 0.12;
    ctx.scale(s, s);
    ctx.shadowColor = 'rgba(13,15,35,0.28)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(0, 30); ctx.lineTo(7.5, 23); ctx.lineTo(12.5, 34.5); ctx.lineTo(18, 32);
    ctx.lineTo(13, 21); ctx.lineTo(23, 21); ctx.closePath();
    ctx.fillStyle = C.text; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.restore();
}
function clickRing(x, y, p) {
    if (p <= 0 || p >= 1) return;
    ctx.save();
    ctx.globalAlpha *= (1 - p) * 0.7;
    ctx.beginPath(); ctx.arc(x, y, 8 + E.out(p) * 30, 0, Math.PI * 2);
    ctx.lineWidth = 3; ctx.strokeStyle = C.magenta; ctx.stroke();
    ctx.restore();
}

/* Cabeçalho de capítulo — mesmo layout em todas as cenas de módulo. */
function chapter(lt, num, kicker, title1, title2, sub, x = 140, y = 360, size = 80) {
    const a = E.out(prog(lt, 0.15, 0.6));
    ctx.save(); ctx.globalAlpha *= a;
    text(num, x, y, { size: 22, weight: 700, font: F.mono, color: C.purple });
    ctx.fillStyle = hexA(C.purple, 0.45);
    ctx.fillRect(x + 46, y - 8, 60 * E.out(prog(lt, 0.3, 0.7)), 2);
    text(kicker.toUpperCase(), x + 122, y, { size: 16, weight: 700, color: C.muted, ls: 3 });
    ctx.restore();
    const lh = size * 1.1;
    reveal(title1, x, y + size * 1.3, prog(lt, 0.3, 0.9), { size, weight: 700, font: F.display, ls: -2 });
    reveal(title2, x, y + size * 1.3 + lh, prog(lt, 0.45, 0.9), { size, weight: 700, font: F.display, ls: -2, grad: GRAD });
    sub.forEach((line, i) => reveal(line, x, y + size * 1.3 + lh + 78 + i * 42, prog(lt, 0.8 + i * 0.1, 0.9), { size: 27, weight: 400, color: C.muted }));
}

function illustrative(x, y, a = 1) {
    text('dados ilustrativos', x, y, { size: 13, color: C.faint, align: 'right', alpha: a });
}

/* ---------------- Fundo e HUD ---------------- */
function background(t) {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

    const blob = (x, y, r, rgb, a) => {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    };
    blob(1520 + Math.sin(t * 0.18) * 120, 120 + Math.cos(t * 0.14) * 60, 1000, '91,46,224', 0.10);
    blob(260 + Math.cos(t * 0.16) * 100, 980 + Math.sin(t * 0.2) * 40, 800, '6,215,230', 0.12);
    blob(980 + Math.sin(t * 0.1) * 200, 640, 700, '236,72,153', 0.05);

    // grade da marca, deslizando bem devagar
    const step = 48, off = (t * 6) % step;
    ctx.save();
    ctx.strokeStyle = 'rgba(91,46,224,0.055)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = -off; x < W; x += step) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
    for (let y = -off; y < H; y += step) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
    ctx.stroke();
    ctx.restore();

    // vinheta clarinha pra grade sumir nas bordas
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 1.05);
    g.addColorStop(0, 'rgba(244,245,250,0)'); g.addColorStop(1, 'rgba(244,245,250,0.85)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* ---------------- Roteiro de narração = linha do tempo ----------------
   Cada trecho dura o tempo da fala (d). sp = tempo de leitura do texto,
   usado pra sincronizar as legendas. Os trechos k1..k7 são os passos da
   demo de Minhas tarefas. */
const NARR = [
    { id: 'intro', d: 9.5, sp: 7.86, c: ['Este é o Faiston OPS:', 'o sistema que reúne projetos, tarefas e a rotina da equipe num só lugar.'] },
    { id: 'antes', d: 20.5, sp: 19.53, c: ['Antes, o controle era feito em planilhas.', 'Várias versões do mesmo arquivo, atualizadas à mão,', 'com o status escrito cada um de um jeito.', 'A planilha não acompanhava o ritmo da operação,', 'e a gestão não tinha uma visão clara do que estava acontecendo.'] },
    { id: 'statement', d: 10.5, sp: 7.47, c: ['Com o Faiston OPS, cada hora apontada, cada tarefa no prazo', 'e cada pessoa do time ficam visíveis, em tempo real.'] },
    { id: 'dash', d: 12.5, sp: 11.46, c: ['No dashboard, a gestão acompanha as horas apontadas,', 'a média por pessoa e a taxa de conclusão do time,', 'ao vivo, sem planilha paralela.'] },
    { id: 'k1', d: 19.5, sp: 16.08, c: ['No dia a dia, cada pessoa trabalha no próprio quadro.', 'Para criar uma tarefa, ela escolhe o projeto, e o cliente já vem preenchido.', 'Depois informa o tipo de atividade, que carrega o peso de complexidade,', 'a natureza e a previsão de conclusão.'] },
    { id: 'k2', d: 17.5, sp: 12.99, c: ['A tarefa entra no quadro.', 'Na hora de trabalhar, é só arrastar o card para Em andamento e apertar Iniciar.', 'O tempo é contado no servidor,', 'e dá para ter mais de um cronômetro rodando ao mesmo tempo.'] },
    { id: 'k3', d: 13, sp: 11.79, c: ['Se a tarefa é concluída depois da previsão, o sistema pede o motivo do atraso.', 'Assim fica fácil separar atraso por dependência externa de atraso por sobrecarga.'] },
    { id: 'k4', d: 20, sp: 16.28, c: ['A faixa de carga mostra quanto cada pessoa tem na fila.', 'O peso das tarefas é somado, e o que está atrasado conta mais.', 'O resultado vira um nível, de tranquilo a atolado,', 'e o líder vê a mesma informação para redistribuir o trabalho.'] },
    { id: 'k5', d: 10, sp: 8.75, c: ['Quando precisa de apoio, a pessoa adiciona colegas como ajudantes,', 'e eles recebem uma notificação na hora.'] },
    { id: 'k6', d: 8, sp: 6.43, c: ['Na agenda, as tarefas aparecem por data,', 'separando prazo e agendamento, no estilo do Outlook.'] },
    { id: 'k7', d: 10.5, sp: 7.94, c: ['E nos carimbos ficam os textos prontos da equipe,', 'para copiar e colar em chamados, e-mails ou no SAP.'] },
    { id: 'ia', d: 15.5, sp: 14.53, c: ['O sistema também tem um assistente de inteligência artificial.', 'Ele encontra informações, explica processos,', 'resume a semana e faz o check-in diário do time.'] },
    { id: 'plat', d: 8.5, sp: 7.44, c: ['Dashboard, tarefas, agenda, assistente, financeiro,', 'forecast, clientes e modo TV: tudo conectado num só sistema.'] },
    { id: 'outro', d: 7, sp: 4.33, c: ['Faiston OPS.', 'Feito pela Faiston, para a operação da Faiston.'] },
];
const NARR_LEAD = 0.5;   // a fala começa meio segundo depois do corte
{ let acc = 0; NARR.forEach(n => { n.s = acc; n.e = acc + n.d; acc = n.e; }); }
const NB = Object.fromEntries(NARR.map(n => [n.id, n]));
const span = id => [NB[id].s, NB[id].e];
const T = {
    intro: span('intro'), antes: span('antes'), statement: span('statement'), dash: span('dash'),
    kanban: [NB.k1.s, NB.k7.e], ia: span('ia'), plat: span('plat'), outro: span('outro'),
};
const DURATION = NARR[NARR.length - 1].e;

const CHAPTERS = [
    { s: T.dash[0], e: T.dash[1], n: '01', label: 'Apontamento' },
    { s: T.kanban[0], e: T.kanban[1], n: '02', label: 'Tarefas' },
    { s: T.ia[0], e: T.ia[1], n: '03', label: 'Assistente OPS' },

function hud(t) {
    const a = prog(t, T.dash[0] - 0.3, 0.6) * (1 - prog(t, T.plat[1] - 0.4, 0.5));
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a;
    mark(158, 70, 40);
    wordmark(194, 79, 24, {});

    const ch = CHAPTERS.find(c => t >= c.s && t < c.e) || CHAPTERS[CHAPTERS.length - 1];
    text(ch.label.toUpperCase(), W - 140, 78, { size: 15, weight: 700, color: C.muted, ls: 3, align: 'right' });
    const lw = measure(ch.label.toUpperCase(), 15, 700, F.body, 3);
    text(`${ch.n} / ${String(CHAPTERS.length).padStart(2, '0')}`, W - 140 - lw - 24, 78, { size: 15, weight: 700, font: F.mono, color: C.purple, align: 'right' });

    // segmentos de progresso por capítulo (proporcionais à duração)
    const total = 420, gap = 10;
    const span = CHAPTERS.reduce((s, c) => s + (c.e - c.s), 0);
    let x = W / 2 - total / 2;
    CHAPTERS.forEach(c => {
        const segW = (total - gap * (CHAPTERS.length - 1)) * (c.e - c.s) / span;
        const p = clamp((t - c.s) / (c.e - c.s));
        rr(x, H - 26, segW, 4, 2); ctx.fillStyle = 'rgba(11,13,31,0.08)'; ctx.fill();
        if (p > 0) { rr(x, H - 26, segW * p, 4, 2); ctx.fillStyle = linGrad(x, 0, x + segW, 0, GRAD); ctx.fill(); }
        x += segW + gap;
    });
    ctx.restore();
}

function sceneIntro(lt) {
    const cx = W / 2, cy = H / 2 - 30;

    const wmW = measure('FAISTON ', wmSize, 700, F.display, -3) + measure('OPS', wmSize, 700, F.display, -3);
    const groupW = markS + gap + wmW;
    const slide = E.inOut(prog(lt, 1.5, 1.0));
    const markX = lerp(cx, cx - groupW / 2 + markS / 2, slide);

    const ring = prog(lt, 0.7, 1.4);
    if (ring > 0 && ring < 1) {
        ctx.save();
        ctx.globalAlpha = (1 - ring) * 0.5;
        ctx.strokeStyle = C.magenta; ctx.lineWidth = 2;
        const rs = markS * (1 + E.out(ring) * 1.6);
        rr(markX - rs / 2, cy - rs / 2, rs, rs, rs * 0.27); ctx.stroke();
        ctx.restore();
    }

    const pm = prog(lt, 0.3, 0.9);
    if (pm > 0) {
        const s = markS * E.back(pm);
        mark(markX, cy, s, { glow: 1, rot: (1 - E.out(pm)) * -0.5, tri: E.back(prog(lt, 0.75, 0.6)) });
    }

    const pw = E.inOut(prog(lt, 1.9, 1.0));
    if (pw > 0) {
        const wx = cx - groupW / 2 + markS + gap;
        ctx.save();
        ctx.beginPath(); ctx.rect(wx, cy - 120, (wmW + 30) * pw, 240); ctx.clip();
        wordmark(wx + (1 - pw) * -30, cy + 2, wmSize, { base: 'middle', ls: -3 });
        ctx.restore();

    reveal('SISTEMA DE OPERAÇÕES · FAISTON', cx, cy - 150, prog(lt, 2.8, 0.9), { size: 18, weight: 700, color: C.purple, ls: 6, align: 'center' });

/* Tempo real da cena -> tempo interno da animação. Cada passo ganha a
   duração da sua fala: as ações rodam mais devagar e param (hold) nos
   momentos que a narração explica. */
const KWARP = (() => {
    const iv = [[0, 6.6], [6.6, 12.4], [12.4, 17.9], [17.9, 22.4], [22.4, 27.0], [27.0, 33.0], [33.0, 41.0]];
    const holds = [
        [[2.15, 3], [2.95, 1.5], [4.0, 1.5], [5.05, 2.5]],   // modal aberto · projeto/cliente · descrição · tudo preenchido
        [[6.7, 1.4], [8.75, 0.3], [11.3, 5.5]],               // card novo · soltou o card · dois timers rodando
        [[13.6, 1.5], [17.1, 2.5]],             // pedido do motivo · card concluído
        [[20.4, 10]],                           // régua de carga aberta
        [[25.7, 2]],                            // aviso dos ajudantes
        [[28.6, 1]],                            // agenda na tela
        [[37.2, 1]],                            // copiado
    ];
    const pts = [[0, 0]]; let r = 0;
    iv.forEach(([a, b], i) => {
        const Rd = NB['k' + (i + 1)].d, hs = holds[i];
        const Hs = hs.reduce((acc, h) => acc + h[1], 0);
        const sp = Math.max(1, (Rd - Hs) / (b - a));
        const hk = sp === 1 ? (Rd - (b - a)) / Hs : 1;
        let ci = a;
        hs.forEach(([hp, hd]) => { r += (hp - ci) * sp; pts.push([r, hp]); r += hd * hk; pts.push([r, hp]); ci = hp; });
        r += (b - ci) * sp; pts.push([r, b]);
    });
    return pts;
})();
function kWarp(real) {
    for (let i = 0; i < KWARP.length - 1; i++) {
        const [r0, x0] = KWARP[i], [r1, x1] = KWARP[i + 1];
        if (real <= r1) return r1 === r0 ? x1 : lerp(x0, x1, clamp((real - r0) / (r1 - r0)));
    }
    return KWARP[KWARP.length - 1][1];
}
function kUnwarp(x) {
    for (let i = 0; i < KWARP.length - 1; i++) {
        const [r0, x0] = KWARP[i], [r1, x1] = KWARP[i + 1];
        if (x1 > x0 && x >= x0 && x <= x1) return lerp(r0, r1, (x - x0) / (x1 - x0));
    }
    return KWARP[KWARP.length - 1][0];
}
let KR = 0;   // tempo real dentro da cena (timers e pulsos andam no relógio de verdade)

function colX(c) { return KW.x + 28 + c * (KCOL.w + KCOL.gap); }
function slotPos(state, id) {
    for (let c = 0; c < 3; c++) {
        const i = KSTATES[state][c].indexOf(id);
        if (i >= 0) return { x: colX(c) + 12, y: KCOL.y + 12 + i * KCARD.step };
    }
    return null;
}

function kTransitions(lt) {
    return [
        E.inOut(prog(lt, K.cardIn, 0.6)),
        E.inOut(prog(lt, K.grab + 0.1, K.drop - K.grab - 0.1)),
        E.inOut(prog(lt, K.moveC, 0.9)),
    ];
}

function cardPos(id, lt) {
    const tr = kTransitions(lt);
    let p = slotPos(0, id) || slotPos(1, id);
    for (let s = 1; s < KSTATES.length; s++) {
        const q = slotPos(s, id);
        p = { x: lerp(p.x, q.x, tr[s - 1]), y: lerp(p.y, q.y, tr[s - 1]) };
    }
    return p;
}

        ctx.translate(-(x + w / 2), -(y + h / 2));

    ctx.shadowBlur = o.lift ? 36 : 6; ctx.shadowOffsetY = o.lift ? 18 : 2;
    rr(x, y, w, h, 14); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.lineWidth = o.running || o.lift ? 1.8 : 1.3;
    ctx.strokeStyle = o.running || o.lift ? C.purple : o.helpers ? hexA(C.cyan, 0.5) : C.border;

        ctx.restore();

        ctx.shadowColor = 'rgba(184,38,201,0.7)'; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(x + w - 12, y + 13, 3.5, 0, Math.PI * 2); ctx.fillStyle = C.magenta; ctx.fill();

    if (o.helpers) {

    if (o.done) {

    } else {
        const okX = x + BTN.okX, runX = x + BTN.runX, by = y + BTN.y;

        ctx.fill();
        if (o.running) pauseIcon(runX + 22, by + BTN.h / 2, 10, '#fff'); else playIcon(runX + 22, by + BTN.h / 2, 10, '#fff');

function drawKanbanCursor(lt) {
    const path = kanbanCursorPath();
    let x = path[0][1], y = path[0][2];
    for (let i = 1; i < path.length; i++) {
        const [t0, x0, y0] = path[i - 1], [t1, x1, y1] = path[i];

function wrapLines(str, maxW, size, weight = 400) {
    const words = str.split(' '), lines = []; let cur = '';
    words.forEach(w => {
        const t = cur ? cur + ' ' + w : w;
        if (measure(t, size, weight) > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
    });
    if (cur) lines.push(cur);
    return lines;
}

let CAPTIONS = true;
function captions(t) {
    if (!CAPTIONS) return;
    const n = NARR.find(m => t >= m.s && t < m.e);
    if (!n) return;
    const lt = t - n.s - NARR_LEAD;
    if (lt < 0 || lt > n.sp + 0.5) return;
    const words = n.c.map(c => c.split(' ').length), total = words.reduce((a, b) => a + b, 0);
    let acc = 0, idx = n.c.length - 1, c0 = 0, c1 = n.sp;
    for (let i = 0; i < n.c.length; i++) {
        const a = n.sp * acc / total, b = n.sp * (acc + words[i]) / total;
        if (lt < b || i === n.c.length - 1) { idx = i; c0 = a; c1 = b; break; }
        acc += words[i];
    }
    const a = prog(lt, c0, 0.15) * (idx === n.c.length - 1 ? 1 - prog(lt, n.sp + 0.2, 0.3) : 1);
    if (a <= 0) return;
    const str = n.c[idx], tw = measure(str, 27, 500);
    const bw = tw + 60, bh = 56, bx = W / 2 - bw / 2, by = H - 106;
    ctx.save(); ctx.globalAlpha = a;
    rr(bx, by, bw, bh, 14); ctx.fillStyle = 'rgba(11,13,31,0.86)'; ctx.fill();
    text(str, W / 2, by + 37, { size: 27, weight: 500, color: '#fff', align: 'center' });
    ctx.restore();
}

function render(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    background(t);
    SCENES.forEach(sc => {
        const [s, e] = sc.r;
        if (t < s || t > e) return;
        let lt = t - s;
        const fin = sc.noFadeIn ? 1 : E.out(prog(lt, 0, 0.5));
        const fout = sc.noFadeOut ? 1 : 1 - E.inOut(prog(t, e - 0.55, 0.55));
        ctx.save();
        ctx.globalAlpha = fin * fout;
        ctx.translate(0, (1 - fout) * -24);
        sc.draw(sc.orig ? lt / clamp((e - s) / sc.orig, 1, 1.5) : lt);
        ctx.restore();
    });
    hud(t);
    captions(t);
    const fade = Math.max(1 - prog(t, 0, 0.4), prog(t, DURATION - 0.8, 0.8));
    if (fade > 0) { ctx.fillStyle = `rgba(244,245,250,${fade})`; ctx.fillRect(0, 0, W, H); }
}

/* Efeitos sonoros: horários (s) tirados da própria linha do tempo, pra trilha
   do MP4 cair exatamente nos cliques, trocas de cena e momentos de sucesso. */
function sfxEvents() {
    const ev = [];
    const kr = x => T.kanban[0] + kUnwarp(x);
    ev.push(['sting', 0.45]);
    [T.antes, T.statement, T.dash, T.kanban, T.ia, T.plat, T.outro].forEach(r => ev.push(['whoosh', r[0] - 0.3]));
    ev.push(['click', T.antes[0] + 6.2]);
    CLICKS.forEach(c => ev.push(['click', kr(c)]));
    [K.cardIn, K.moveC + 0.45, K.toast, K.copy + 0.15].forEach(c => ev.push(['ding', kr(c)]));
    ev.push(['sting', T.outro[0] + 0.25]);
    return ev.sort((a, b) => a[1] - b[1]).map(([k, s]) => [k, +s.toFixed(3)]);
}

/* ---------------- Player ---------------- */
const params = new URLSearchParams(location.search);
const EXPORT = params.has('export');
const LOOP = params.get('loop') === '1';
let t = 0, playing = false, last = 0;

const $ = id => document.getElementById(id);
const ui = $('ui'), startBtn = $('start'), playBtn = $('btn-play'), scrub = $('scrub'), timeEl = $('time');
const fmtT = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function syncUI() {
    playBtn.textContent = playing ? '❚❚' : '▶';
    scrub.value = Math.round((t / DURATION) * 1000);
    timeEl.textContent = `${fmtT(t)} / ${fmtT(DURATION)}`;
}

function setCaptions(on) { CAPTIONS = on; const b = $('btn-cc'); if (b) b.setAttribute('aria-pressed', String(on)); }

/* Efeitos sonoros ao vivo (WebAudio) — mesmos eventos e timbres da trilha do MP4. */
let SOUND = true, actx = null, sfxPrev = 0;
const SFX = sfxEvents();
function audioCtx() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
    return actx;
}
function bellAt(a, f, t0, dur, amp, out) {
    [[1, 1, 6], [2.01, 0.25, 10], [3.02, 0.08, 16]].forEach(([m, g, k]) => {
        const o = a.createOscillator(), v = a.createGain();
        o.frequency.value = f * m;
        v.gain.setValueAtTime(0, t0); v.gain.linearRampToValueAtTime(amp * g, t0 + 0.004);
        v.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.min(dur, 6 / k * 1.2));
        o.connect(v).connect(out); o.start(t0); o.stop(t0 + dur);
    });
}
function playSfx(kind) {
    const a = audioCtx(); if (!a) return;
    const out = a.createGain(); out.gain.value = 0.55; out.connect(a.destination);
    const t0 = a.currentTime + 0.01;
    if (kind === 'click') {
        const o = a.createOscillator(), v = a.createGain();
        o.frequency.value = 2400; v.gain.setValueAtTime(0.09, t0); v.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.04);
        o.connect(v).connect(out); o.start(t0); o.stop(t0 + 0.05);
    } else if (kind === 'ding') {
        bellAt(a, 1318.5, t0, 0.9, 0.10, out); bellAt(a, 1975.5, t0 + 0.09, 0.9, 0.08, out);
    } else if (kind === 'sting') {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bellAt(a, f, t0 + i * 0.08, 1.6, i < 3 ? 0.08 : 0.06, out));
    } else if (kind === 'whoosh') {
        const len = 0.7, buf = a.createBuffer(1, Math.floor(a.sampleRate * len), a.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const src = a.createBufferSource(), bp = a.createBiquadFilter(), v = a.createGain();
        src.buffer = buf; bp.type = 'bandpass'; bp.Q.value = 0.8;
        bp.frequency.setValueAtTime(500, t0); bp.frequency.exponentialRampToValueAtTime(2600, t0 + len);
        v.gain.setValueAtTime(0, t0); v.gain.linearRampToValueAtTime(0.05, t0 + len / 2); v.gain.linearRampToValueAtTime(0, t0 + len);
        src.connect(bp).connect(v).connect(out); src.start(t0); src.stop(t0 + len);
    }
}
function tickSfx() {
    if (playing && SOUND && t > sfxPrev && t - sfxPrev < 0.25) SFX.forEach(([k, at]) => { if (at > sfxPrev && at <= t) playSfx(k); });
    sfxPrev = t;
}
function setSound(on) {
    SOUND = on; const b = $('btn-som');
    if (b) { b.setAttribute('aria-pressed', String(on)); b.textContent = on ? '🔊 Sons' : '🔈 Sons'; }
    if (on) audioCtx();
}

function frame(now) {
    if (playing) {
        t += Math.min(0.1, (now - last) / 1000);
        if (t >= DURATION) {
            if (LOOP) t = 0; else { t = DURATION; playing = false; if (recorder) recorder.stop(); }
        }
    }
    last = now;
    render(t);
    syncUI();
    tickSfx();
    requestAnimationFrame(frame);
}

function play() { if (t >= DURATION) t = 0; playing = true; startBtn.classList.add('hide'); if (SOUND) audioCtx(); }
function pause() { playing = false; }
function toggle() { playing ? pause() : play(); }
function fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
}

let recorder = null;
function record() {
    if (recorder) return;
    let stream;
    try { stream = cv.captureStream(60); } catch (e) { alert('Este navegador não grava canvas.'); return; }
    const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16e6 });
    const chunks = [];
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
        a.download = 'faiston-ops.webm'; a.click();
        recorder = null; $('btn-rec').classList.remove('on'); $('btn-rec').textContent = '● Gravar .webm';
    };
    t = 0; recorder.start(); play();
    $('btn-rec').classList.add('on'); $('btn-rec').textContent = '● Gravando…';
}

let hideTimer = null;
function poke() {
    ui.classList.remove('hide');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => { if (playing) ui.classList.add('hide'); }, 2200);
}

async function boot() {
    try {
        await Promise.all([
            '400 20px Inter', '500 20px Inter', '600 20px Inter', '700 20px Inter', '800 20px Inter',
            '500 20px "Space Grotesk"', '700 20px "Space Grotesk"',
            '500 20px "JetBrains Mono"', '600 20px "JetBrains Mono"', '700 20px "JetBrains Mono"',
        ].map(f => document.fonts.load(f)));
        await document.fonts.ready;
    } catch (e) { /* sem internet: cai nas fontes do sistema */ }

    if (EXPORT) {
        document.body.classList.add('export');
        window.VIDEO_DURATION = DURATION;
        window.SFX_EVENTS = sfxEvents();
        setCaptions(params.get('legendas') !== '0');
        window.renderAt = s => render(s);
        window.videoReady = true;
        render(0);
        return;
    }

    setCaptions(params.get('legendas') !== '0');
    $('btn-cc').addEventListener('click', () => setCaptions(!CAPTIONS));
    setSound(params.get('sons') !== '0');
    $('btn-som').addEventListener('click', () => setSound(!SOUND));
    const ts = parseFloat(params.get('t'));
    if (!isNaN(ts)) { t = clamp(ts, 0, DURATION); }
    startBtn.addEventListener('click', play);
    playBtn.addEventListener('click', toggle);
    $('btn-restart').addEventListener('click', () => { t = 0; play(); });
    $('btn-full').addEventListener('click', fullscreen);
    if ($('btn-rec')) $('btn-rec').addEventListener('click', record);   // ausente na versão publicada no claude.ai
    scrub.addEventListener('input', () => { t = (scrub.value / 1000) * DURATION; startBtn.classList.add('hide'); });
    cv.addEventListener('click', toggle);
    document.addEventListener('mousemove', poke);
    document.addEventListener('keydown', e => {
        if (e.code === 'Space') { e.preventDefault(); toggle(); }
        else if (e.key === 'r' || e.key === 'R') { t = 0; play(); }
        else if (e.key === 'f' || e.key === 'F') fullscreen();
        else if (e.key === 'c' || e.key === 'C') setCaptions(!CAPTIONS);
        else if (e.key === 's' || e.key === 'S') setSound(!SOUND);
        else if (e.key === 'ArrowRight') t = Math.min(DURATION, t + 5);
        else if (e.key === 'ArrowLeft') t = Math.max(0, t - 5);
        poke();
    });
    poke();
    requestAnimationFrame(n => { last = n; frame(n); });
}

boot();
})();
</script>
</body>
</html>
