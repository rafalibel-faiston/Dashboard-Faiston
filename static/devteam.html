<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipe Dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { sans: ['Inter','sans-serif'], mono: ['JetBrains Mono','ui-monospace','monospace'] },
                colors: { faiston: {
                    bg:'#F4F5FA', dark:'#0B0D1F', border:'#E5E8F0', muted:'#5E647A', faint:'#9097AC',
                    cyan:'#06D7E6', purple:'#5B2EE0', magenta:'#B826C9', pink:'#EC4899', chart_pink:'#EC4899'
                } }
            }}
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>(function(){var t=localStorage.getItem('faiston_tema');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
    <style>
        .custom-scrollbar::-webkit-scrollbar{width:5px;height:5px}
        .custom-scrollbar::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:10px}
        .card-dev { transition: box-shadow .15s, transform .15s; cursor: grab; }
        .card-dev:hover { box-shadow: 0 4px 16px rgba(91,46,224,.12); transform: translateY(-1px); }
        .card-dev.dragging { opacity: .4; }
        .col-drop.drag-over { background: #F0F4FF; border-color: #5B2EE0; }
    </style>
</head>
<body class="bg-faiston-bg font-sans min-h-screen">

<!-- HEADER -->
<header class="bg-white border-b border-faiston-border px-6 py-3 flex items-center justify-between sticky top-0 z-20">
    <div class="flex items-center gap-3">
        <a href="/dashboard" class="flex items-center gap-2 text-sm text-slate-500 hover:text-faiston-dark transition-colors">
            <i class="ph ph-arrow-left"></i> Dashboard
        </a>
        <span class="w-px h-4 bg-slate-200"></span>
        <i class="ph ph-code text-faiston-purple"></i>
        <span class="text-sm font-bold text-faiston-dark">Equipe Dev</span>
    </div>
    <div class="flex items-center gap-3">
        <button onclick="abrirModal()" class="flex items-center gap-2 bg-faiston-purple text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:opacity-90 transition-opacity">
            <i class="ph ph-plus"></i> Nova tarefa
        </button>
        <button onclick="toggleTema()" id="btn-tema-h" class="btn-theme" title="Alternar tema">
            <i class="ph ph-moon" id="icon-tema-h"></i>
        </button>
        <button onclick="logout()" class="text-faiston-faint hover:text-faiston-pink transition-colors">
            <i class="ph ph-sign-out text-lg"></i>
        </button>
        <div class="flex items-center gap-2 pl-3 border-l border-faiston-border">
            <div class="w-8 h-8 rounded-lg grad-bg flex items-center justify-center text-white text-xs font-bold" id="user-av">?</div>
            <span class="text-sm font-semibold text-faiston-dark" id="user-nome">...</span>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-6">
    <div class="mb-5">
        <h1 class="text-xl font-bold text-faiston-dark tracking-tight">Tarefas do app</h1>
        <p class="text-xs text-faiston-muted">Quadro privado da equipe de desenvolvimento — só visível pra quem tem perfil dev.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="board">
        <div class="col-drop bg-white rounded-2xl border-2 border-dashed border-faiston-border p-3 transition-colors" data-status="todo">
            <div class="flex items-center gap-2 mb-3 px-1">
                <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                <span class="text-xs font-bold text-slate-600 uppercase tracking-wide">A Fazer</span>
                <span class="ml-auto text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full" id="count-todo">0</span>
            </div>
            <div class="space-y-2 min-h-[120px]" id="lista-todo"></div>
        </div>
        <div class="col-drop bg-white rounded-2xl border-2 border-dashed border-faiston-border p-3 transition-colors" data-status="doing">
            <div class="flex items-center gap-2 mb-3 px-1">
                <span class="w-2 h-2 rounded-full bg-faiston-cyan"></span>
                <span class="text-xs font-bold text-slate-600 uppercase tracking-wide">Em Progresso</span>
                <span class="ml-auto text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full" id="count-doing">0</span>
            </div>
            <div class="space-y-2 min-h-[120px]" id="lista-doing"></div>
        </div>
        <div class="col-drop bg-white rounded-2xl border-2 border-dashed border-faiston-border p-3 transition-colors" data-status="done">
            <div class="flex items-center gap-2 mb-3 px-1">
                <span class="w-2 h-2 rounded-full bg-faiston-purple"></span>
                <span class="text-xs font-bold text-slate-600 uppercase tracking-wide">Concluído</span>
                <span class="ml-auto text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full" id="count-done">0</span>
            </div>
            <div class="space-y-2 min-h-[120px]" id="lista-done"></div>
        </div>
    </div>
</main>

<!-- MODAL TAREFA -->
<div id="modal-tarefa" class="hidden fixed inset-0 bg-[rgba(7,7,15,0.5)] z-50 flex items-center justify-center p-4" style="backdrop-filter:blur(8px)">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-faiston-border">
        <div class="px-6 py-4 flex items-center justify-between border-b border-faiston-border">
            <span class="text-sm font-bold text-faiston-dark" id="modal-titulo-label">Nova tarefa</span>
            <button onclick="fecharModal()" class="text-slate-400 hover:text-faiston-dark"><i class="ph ph-x text-lg"></i></button>
        </div>
        <div class="p-6 space-y-4">
            <div>
                <label class="text-xs font-semibold text-slate-500 mb-1 block">Título</label>
                <input type="text" id="m-titulo" placeholder="Ex: Corrigir bug no filtro de clientes"
                    class="w-full px-3 py-2 border border-faiston-border rounded-lg text-sm focus:outline-none focus:border-faiston-purple transition-all">
            </div>
            <div>
                <label class="text-xs font-semibold text-slate-500 mb-1 block">Descrição</label>
                <textarea id="m-descricao" rows="4" placeholder="Detalhes (opcional)"
                    class="w-full px-3 py-2 border border-faiston-border rounded-lg text-sm focus:outline-none focus:border-faiston-purple transition-all resize-none"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs font-semibold text-slate-500 mb-1 block">Status</label>
                    <select id="m-status" class="w-full px-3 py-2 border border-faiston-border rounded-lg text-sm focus:outline-none focus:border-faiston-purple bg-white">
                        <option value="todo">A Fazer</option>
                        <option value="doing">Em Progresso</option>
                        <option value="done">Concluído</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-500 mb-1 block">Atribuído a</label>
                    <select id="m-atribuido" class="w-full px-3 py-2 border border-faiston-border rounded-lg text-sm focus:outline-none focus:border-faiston-purple bg-white">
                        <option value="">Ninguém</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="px-6 py-4 border-t border-faiston-border flex items-center gap-2">
            <button onclick="deletarTarefaModal()" id="btn-deletar-tarefa" class="hidden text-xs font-semibold text-faiston-pink hover:opacity-80 transition-opacity flex items-center gap-1">
                <i class="ph ph-trash"></i> Excluir
            </button>
            <div class="ml-auto flex items-center gap-2">
                <button onclick="fecharModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-500 hover:bg-slate-50 transition-colors">Cancelar</button>
                <button onclick="salvarTarefaModal()" class="px-4 py-2 rounded-lg text-sm font-semibold bg-faiston-purple text-white hover:opacity-90 transition-opacity">Salvar</button>
            </div>
        </div>
    </div>
</div>

<script>
let tarefas = [];
let usuariosDev = [];
let modalTarefaId = null;
let dragTaskId = null;

async function init() {
    try {
        const res = await fetch('/api/me');
        if (!res.ok) { window.location.href = '/'; return; }
        const me = await res.json();
        if (me.perfil_real !== 'dev') { window.location.href = '/dashboard'; return; }
        document.getElementById('user-nome').textContent = me.nome;
        document.getElementById('user-av').textContent = me.nome.charAt(0).toUpperCase();
    } catch(e) { window.location.href = '/'; return; }
    await carregarUsuarios();
    await carregarTarefas();
    configurarDropZones();
}

async function logout() {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/';
}

async function carregarUsuarios() {
    try {
        const res = await fetch('/api/dev-tarefas/usuarios');
        if (!res.ok) return;
        usuariosDev = await res.json();
        const sel = document.getElementById('m-atribuido');
        sel.innerHTML = '<option value="">Ninguém</option>' + usuariosDev.map(u => `<option value="${u.id}">${u.nome}</option>`).join('');
    } catch(e) {}
}

async function carregarTarefas() {
    try {
        const res = await fetch('/api/dev-tarefas');
        if (!res.ok) return;
        tarefas = await res.json();
        renderBoard();
    } catch(e) {}
}

function iniciais(nome) {
    return (nome || '?').charAt(0).toUpperCase();
}

function renderBoard() {
    ['todo', 'doing', 'done'].forEach(status => {
        const lista = tarefas.filter(t => t.status === status);
        document.getElementById('count-' + status).textContent = lista.length;
        const el = document.getElementById('lista-' + status);
        if (!lista.length) {
            el.innerHTML = `<div class="text-xs text-slate-300 text-center py-6">Sem tarefas</div>`;
            return;
        }
        el.innerHTML = lista.map(t => `
            <div class="card-dev bg-white border border-faiston-border rounded-xl p-3" draggable="true" data-id="${t.id}" onclick="abrirModal(${t.id})">
                <p class="text-sm font-semibold text-faiston-dark leading-snug mb-1.5">${escapeHtml(t.titulo)}</p>
                ${t.descricao ? `<p class="text-xs text-slate-500 leading-snug mb-2 line-clamp-2">${escapeHtml(t.descricao)}</p>` : ''}
                <div class="flex items-center justify-between mt-2">
                    <span class="text-[10px] text-faiston-faint">${t.criado_por_nome ? 'por ' + t.criado_por_nome.split(' ')[0] : ''}</span>
                    ${t.atribuido_a_nome ? `<div class="w-6 h-6 rounded-full grad-bg flex items-center justify-center text-white text-[10px] font-bold" title="${escapeHtml(t.atribuido_a_nome)}">${iniciais(t.atribuido_a_nome)}</div>` : ''}
                </div>
            </div>
        `).join('');
    });
    // Re-liga eventos de drag nos cards recém-renderizados
    document.querySelectorAll('.card-dev').forEach(card => {
        card.addEventListener('dragstart', (e) => {
            dragTaskId = parseInt(card.dataset.id);
            card.classList.add('dragging');
            e.stopPropagation();
        });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
    });
}

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}

function configurarDropZones() {
    document.querySelectorAll('.col-drop').forEach(zona => {
        zona.addEventListener('dragover', (e) => {
            e.preventDefault();
            zona.classList.add('drag-over');
        });
        zona.addEventListener('dragleave', () => zona.classList.remove('drag-over'));
        zona.addEventListener('drop', async (e) => {
            e.preventDefault();
            zona.classList.remove('drag-over');
            if (dragTaskId == null) return;
            const novoStatus = zona.dataset.status;
            const tarefa = tarefas.find(t => t.id === dragTaskId);
            if (!tarefa || tarefa.status === novoStatus) { dragTaskId = null; return; }
            await fetch(`/api/dev-tarefas/${dragTaskId}`, {
                method: 'PUT', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ titulo: tarefa.titulo, descricao: tarefa.descricao, status: novoStatus, atribuido_a: tarefa.atribuido_a || null })
            });
            dragTaskId = null;
            await carregarTarefas();
        });
    });
}

function abrirModal(id) {
    modalTarefaId = id || null;
    const tarefa = id ? tarefas.find(t => t.id === id) : null;
    document.getElementById('modal-titulo-label').textContent = tarefa ? 'Editar tarefa' : 'Nova tarefa';
    document.getElementById('m-titulo').value = tarefa ? tarefa.titulo : '';
    document.getElementById('m-descricao').value = tarefa ? tarefa.descricao : '';
    document.getElementById('m-status').value = tarefa ? tarefa.status : 'todo';
    document.getElementById('m-atribuido').value = tarefa && tarefa.atribuido_a ? tarefa.atribuido_a : '';
    document.getElementById('btn-deletar-tarefa').classList.toggle('hidden', !tarefa);
    document.getElementById('modal-tarefa').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    document.getElementById('m-titulo').focus();
}

function fecharModal() {
    document.getElementById('modal-tarefa').classList.add('hidden');
    document.body.style.overflow = '';
    modalTarefaId = null;
}

async function salvarTarefaModal() {
    const titulo = document.getElementById('m-titulo').value.trim();
    if (!titulo) { document.getElementById('m-titulo').focus(); return; }
    const body = {
        titulo,
        descricao: document.getElementById('m-descricao').value,
        status: document.getElementById('m-status').value,
        atribuido_a: document.getElementById('m-atribuido').value ? parseInt(document.getElementById('m-atribuido').value) : null,
    };
    if (modalTarefaId) {
        await fetch(`/api/dev-tarefas/${modalTarefaId}`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    } else {
        await fetch('/api/dev-tarefas', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    }
    fecharModal();
    await carregarTarefas();
}

async function deletarTarefaModal() {
    if (!modalTarefaId || !confirm('Excluir esta tarefa?')) return;
    await fetch(`/api/dev-tarefas/${modalTarefaId}`, { method: 'DELETE' });
    fecharModal();
    await carregarTarefas();
}

function toggleTema() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const novo = !isDark;
    localStorage.setItem('faiston_tema', novo ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', novo ? 'dark' : 'light');
    const icon = document.getElementById('icon-tema-h');
    if (icon) icon.className = novo ? 'ph ph-sun text-faiston-cyan' : 'ph ph-moon';
}
(function() {
    const icon = document.getElementById('icon-tema-h');
    if (icon && localStorage.getItem('faiston_tema') === 'dark') icon.className = 'ph ph-sun text-faiston-cyan';
})();

init();
</script>
</body>
</html>
